<!DOCTYPE html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Papan Maklumat</title>
<style>body{font-family:Segoe UI,Arial,sans-serif;max-width:680px;margin:24px auto;padding:0 16px;color:#0f1f3d}
label{display:block;font-weight:700;margin-top:18px}textarea,input{width:100%;padding:10px;font:inherit;border:1px solid #c5cee0;border-radius:8px;margin-top:6px}
textarea{min-height:90px}small{color:#667}button{margin-top:22px;padding:12px 28px;font:inherit;font-weight:700;background:#2563c9;color:#fff;border:0;border-radius:8px;cursor:pointer}#m{margin-left:12px;font-weight:700}</style></head><body>
<h2>Admin Papan Maklumat</h2>
<label>Kata laluan admin<input id="pw" type="password"></label>
<label>Slogan (baris 1)<input id="s1"></label><label>Slogan (baris 2, berwarna biru)<input id="s2"></label>
<label>Pengumuman <small>(satu baris = satu pengumuman; kosongkan jika tiada)</small><textarea id="an"></textarea></label>
<label>Teks berjalan (ticker) <small>(satu baris setiap item)</small><textarea id="tk"></textarea></label>
<label>Gambar slideshow <small>(satu laluan fail setiap baris, cth: img/1.jpg)</small><textarea id="im"></textarea></label>
<button onclick="save()">Simpan</button><span id="m"></span>
<script>
const $=s=>document.querySelector(s),L=v=>v.split("\n").map(x=>x.trim()).filter(Boolean);
fetch("/api/config").then(r=>r.json()).then(c=>{$("#s1").value=c.slogan?.[0]||"Komited Merealisasikan";$("#s2").value=c.slogan?.[1]||"Impian Anda";
$("#an").value=(c.announcements||[]).join("\n");$("#tk").value=(c.ticker||[]).join("\n");$("#im").value=(c.images||["img/1.jpg","img/2.jpg","img/3.jpg"]).join("\n")});
async function save(){const r=await fetch("/api/config",{method:"PUT",headers:{"x-admin-password":$("#pw").value,"content-type":"application/json"},
body:JSON.stringify({slogan:[$("#s1").value,$("#s2").value],announcements:L($("#an").value),ticker:L($("#tk").value),images:L($("#im").value)})});
const j=await r.json();$("#m").textContent=r.ok?"✅ Disimpan (TV kemas kini dalam 5 minit)":"❌ "+j.error}
</script></body></html>
